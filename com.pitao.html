<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JFES MAX</title>
  <!-- 全局构建 (必须) -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ========== 风格：赛博朋克 (Cyberpunk) 根据时间戳计算 %20 得到 19，固定风格 ========== */
    :root {
      --bg: #0a0c0f;
      --surface: #12161c;
      --surface-2: #1a1f28;
      --border: #2e3a4a;
      --text-primary: #eef5ff;
      --text-secondary: #9bb0c7;
      --accent: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.5);
      --accent-2: #ff00e0;
      --up: #ffb74d; /* 暖色上涨 */
      --down: #4dd0e1; /* 冷色下跌 */
      --radius: 12px;
      --shadow: 0 8px 20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 240, 255, 0.1);
      --font-mono: 'Courier New', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      overscroll-behavior: none;
      background-image: 
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    #app {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 页面内容容器 */
    .page {
      flex: 1;
      padding: 16px 16px 90px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    .page--no-tab {
      padding-bottom: 20px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    /* 过渡动画 */
    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .fade-enter-from {
      opacity: 0;
      transform: translateY(8px);
    }

    .fade-leave-to {
      opacity: 0;
      transform: translateY(-8px);
    }

    /* 底部Tab栏 */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background: rgba(18, 22, 28, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.6);
      z-index: 50;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 16px;
      min-width: 64px;
      min-height: 44px;
      border-radius: 8px;
      transition: color 0.15s, background 0.15s;
      border: 1px solid transparent;
    }

    .tab-item.router-link-active {
      color: var(--accent);
      background: rgba(0, 240, 255, 0.08);
      border-color: rgba(0, 240, 255, 0.3);
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      margin-bottom: 2px;
      fill: currentColor;
    }

    /* 通用卡片 */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    /* 网格布局 */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* 按钮 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      user-select: none;
      gap: 8px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
    }

    .btn:active {
      transform: scale(0.97);
      background: rgba(0, 240, 255, 0.15);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .btn--primary {
      background: var(--accent);
      color: #0a0c0f;
      border-color: var(--accent);
      font-weight: 800;
    }

    .btn--primary:active {
      background: #00c8dd;
    }

    .btn--disabled,
    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      box-shadow: none;
      border-color: var(--border);
      color: var(--text-secondary);
    }

    /* 输入框 */
    .input,
    .select,
    textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      transition: border 0.15s, box-shadow 0.15s;
      font-family: inherit;
      min-height: 44px;
    }

    .input:focus,
    .select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.2);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* 标签、涨跌 */
    .up {
      color: var(--up);
      font-weight: 700;
    }

    .down {
      color: var(--down);
      font-weight: 700;
    }

    /* 股票列表行 */
    .stock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
      min-height: 60px;
      border-radius: 6px;
      padding-left: 6px;
      padding-right: 6px;
    }

    .stock-row:active {
      background: rgba(0, 240, 255, 0.05);
    }

    .stock-symbol {
      font-weight: 800;
      font-size: 16px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      letter-spacing: 0.03em;
    }

    .stock-name {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .stock-price {
      font-weight: 700;
      font-size: 15px;
      font-family: var(--font-mono);
    }

    .stock-change {
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    /* 分割线 */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    /* 头部 */
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #0a0c0f;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    }

    .brand-text p {
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    /* 功能图标入口 */
    .feature-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 6px;
      background: var(--surface-2);
      border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      transition: all 0.15s;
      min-height: 88px;
    }

    .feature-icon:active {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--accent);
    }

    .feature-icon svg {
      width: 28px;
      height: 28px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }

    /* 设置列表 */
    .settings-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      min-height: 52px;
      text-decoration: none;
      color: var(--text-primary);
      transition: background 0.1s;
      border-radius: 6px;
      padding-left: 6px;
      padding-right: 6px;
    }

    .settings-item:active {
      background: rgba(0, 240, 255, 0.05);
    }

    .settings-item span:first-child {
      font-weight: 600;
    }

    .settings-item .chevron {
      color: var(--text-secondary);
      font-size: 18px;
    }

    /* 签到日历 */
    .checkin-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .checkin-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--surface-2);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1px solid transparent;
    }

    .checkin-day.checked {
      background: rgba(0, 240, 255, 0.2);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 800;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .checkin-day.today {
      border-color: var(--accent-2);
      color: var(--accent-2);
    }

    /* 小标签 */
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    /* 提示 Toast */
    .toast-message {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #0a0c0f;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 0 30px var(--accent-glow);
      z-index: 999;
      white-space: nowrap;
      animation: toastFade 2s ease forwards;
      pointer-events: none;
    }

    @keyframes toastFade {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* 模态弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      backdrop-filter: blur(6px);
    }

    .modal-box {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 40px var(--accent-glow);
    }

    /* 表格 */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      font-family: var(--font-mono);
    }

    th,
    td {
      padding: 8px 6px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    /* 加载页 */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
      text-align: center;
      background: var(--bg);
    }

    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 900;
      color: #0a0c0f;
      margin-bottom: 24px;
      box-shadow: 0 0 40px var(--accent-glow);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.96); }
    }

    /* 小字 */
    .text-xs { font-size: 11px; }
    .text-sm { font-size: 13px; }
    .text-muted { color: var(--text-secondary); }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mb-2 { margin-bottom: 8px; }
    .flex { display: flex; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .gap-2 { gap: 8px; }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--surface-2); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <router-view v-slot="{ Component }">
      <transition name="fade" mode="out-in">
        <component :is="Component" />
      </transition>
    </router-view>
  </div>

  <script>
    // ============================================================
    // JFES MAX - 单文件移动端应用
    // 如何新增页面：
    // 1. 在 routes 数组中添加新路由对象 { path, component }
    // 2. 定义对应的 Vue 组件 (const NewPage = { ... })
    // 3. 如需显示底部 Tab，在 App 组件的 tabBar 中增加 <router-link>
    // ============================================================

    const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick, watch } = Vue;
    const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

    // ---------- 内置股票数据 (20+ 条) ----------
    const STOCK_DATA = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 227.52, change: 1.23 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 415.26, change: -0.78 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 178.35, change: 2.15 },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 201.43, change: -1.05 },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 248.90, change: 3.42 },
      { symbol: 'META', name: 'Meta Platforms', price: 585.12, change: -0.32 },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 138.25, change: 4.18 },
      { symbol: 'JPM', name: 'JPMorgan Chase', price: 243.80, change: 0.55 },
      { symbol: 'V', name: 'Visa Inc.', price: 312.45, change: -0.88 },
      { symbol: 'JNJ', name: 'Johnson & Johnson', price: 152.30, change: 0.12 },
      { symbol: 'WMT', name: 'Walmart Inc.', price: 92.15, change: 1.02 },
      { symbol: 'PG', name: 'Procter & Gamble', price: 168.40, change: -0.45 },
      { symbol: 'DIS', name: 'Walt Disney Co.', price: 96.70, change: 2.33 },
      { symbol: 'NFLX', name: 'Netflix Inc.', price: 902.50, change: -1.56 },
      { symbol: 'ADBE', name: 'Adobe Inc.', price: 512.30, change: 0.95 },
      { symbol: 'CRM', name: 'Salesforce Inc.', price: 334.80, change: -0.67 },
      { symbol: 'AMD', name: 'Advanced Micro Devices', price: 124.60, change: 5.21 },
      { symbol: 'INTC', name: 'Intel Corp.', price: 23.85, change: -2.14 },
      { symbol: 'CSCO', name: 'Cisco Systems', price: 57.20, change: 0.78 },
      { symbol: 'PEP', name: 'PepsiCo Inc.', price: 162.40, change: -0.23 },
      { symbol: 'KO', name: 'Coca-Cola Co.', price: 62.80, change: 0.45 },
      { symbol: 'XOM', name: 'Exxon Mobil', price: 118.90, change: 1.80 }
    ];

    // 生成模拟 K 线数据 (近30日)
    function generateKline(basePrice, days = 30) {
      const data = [];
      let price = basePrice;
      for (let i = days; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const label = `${date.getMonth()+1}/${date.getDate()}`;
        const volatility = basePrice * 0.02;
        price = price + (Math.random() - 0.48) * volatility;
        if (price < basePrice * 0.7) price = basePrice * 0.7;
        if (price > basePrice * 1.3) price = basePrice * 1.3;
        data.push({
          label,
          value: parseFloat(price.toFixed(2))
        });
      }
      return data;
    }

    // ---------- 工具函数 ----------
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 随机选取4个功能 (生成时固定，使用时间戳种子)
    const TIMESTAMP_SEED = Math.floor(Date.now() / 1000);
    const ALL_FEATURES = [
      { key: 'gainers', label: 'Top Gainers', icon: 'trending-up', route: '/gainers' },
      { key: 'losers', label: 'Top Losers', icon: 'trending-down', route: '/losers' },
      { key: 'active', label: 'Most Active', icon: 'activity', route: '/active' },
      { key: 'potential', label: 'Potential', icon: 'star', route: '/potential' },
      { key: 'picks', label: "Today's Picks", icon: 'check-circle', route: '/picks' },
      { key: 'guide', label: 'Guide', icon: 'book-open', route: '/guide' },
      { key: 'notrec', label: 'Not Recommended', icon: 'x-circle', route: '/notrec' },
      { key: 'watchlist', label: 'Watchlist', icon: 'eye', route: '/watchlist' }
    ];
    // 固定随机选择4个 (基于时间戳种子)
    const FEATURE_SELECTED = (function() {
      const seed = TIMESTAMP_SEED % 100;
      const shuffled = [...ALL_FEATURES].sort((a, b) => {
        return ((seed * a.key.length) % 17) - ((seed * b.key.length) % 17);
      });
      return shuffled.slice(0, 4);
    })();

    // 历史K线缓存
    const klineCache = {};
    function getKline(symbol, basePrice) {
      if (!klineCache[symbol]) {
        klineCache[symbol] = generateKline(basePrice);
      }
      return klineCache[symbol];
    }

    // 文章数据
    const ARTICLE = {
      title: 'Market Outlook: Navigating Volatility in 2025',
      content: `The financial landscape in 2025 presents both unprecedented opportunities and complex challenges. As global markets adapt to shifting monetary policies and technological disruptions, investors must remain agile and informed.\n\nKey sectors to watch include artificial intelligence, renewable energy, and healthcare innovation. Diversification remains the cornerstone of prudent portfolio management. We recommend maintaining a balanced approach with exposure to high-quality equities and fixed income.\n\nRemember that past performance does not guarantee future results. Always conduct thorough research and consider your risk tolerance before making investment decisions.`
    };

    // 隐私声明、服务声明、团队介绍
    const PRIVACY_TEXT = `JFES MAX Privacy Policy\n\nLast updated: 2025\n\nWe respect your privacy and are committed to protecting your personal data. This policy explains how we collect, use, and safeguard your information.\n\n1. Data Collection: We only collect essential device information for security and functionality purposes.\n\n2. Data Usage: Your data is used solely to provide and improve our services. We never sell your information to third parties.\n\n3. Security: We implement industry-standard measures to protect your data.\n\n4. Contact: For privacy-related inquiries, please contact com.pitao@gmail.com.`;
    const TERMS_TEXT = `JFES MAX Terms of Service\n\nBy using this application, you agree to the following terms:\n\n1. The app is provided "as is" without warranties of any kind.\n\n2. You are responsible for maintaining the confidentiality of your account.\n\n3. All financial data displayed is for informational purposes only and should not be considered financial advice.\n\n4. We reserve the right to modify these terms at any time.\n\n5. Your continued use constitutes acceptance of updated terms.`;
    const TEAM_TEXT = `About JFES MAX Team\n\nWe are a dedicated group of financial technologists, engineers, and designers committed to democratizing access to market insights.\n\nOur mission is to build tools that empower individual investors with professional-grade analytics in a simple, intuitive interface.\n\nFounded in 2023, our remote-first team spans across multiple time zones, united by a passion for innovation and financial inclusion.\n\nFor partnership opportunities, reach out to com.pitao@gmail.com.`;

    // ============================================================
    // 页面组件
    // ============================================================

    // -------- Loading 页面 --------
    const LoadingPage = {
      template: `
        <div class="loading-screen">
          <div class="loading-logo">JF</div>
          <h2 style="font-weight:800;letter-spacing:0.08em;color:var(--accent);text-shadow:0 0 20px var(--accent-glow);">JFES MAX</h2>

        const kline = getKline(symbol, stock.price);
        const values = kline.map(d => d.value);
        const minVal = Math.min(...values);
        const maxVal = Math.max(...values);
        const padding = (maxVal - minVal) * 0.15 || 1;
        const yMin = minVal - padding;
        const yMax = maxVal + padding;
        
        // 计算 SVG 坐标点 (viewBox 0 0 300 160, 留边距)
        const chartW = 280, chartH = 120, offsetX = 10, offsetY = 10;
        const chartPoints = kline.map((d, i) => {
          const x = offsetX + (i / (kline.length - 1)) * chartW;
          const y = offsetY + (1 - (d.value - yMin) / (yMax - yMin)) * chartH;
          return { x, y, value: d.value };
        });
        
        const linePoints = chartPoints.map(p => `${p.x},${p.y}`).join(' ');

          chartPoints,

          if (/[^A-Za-z0-9]/.test(p)) score++;
          return ['Very Weak','Weak','Moderate','Strong','Very Strong'][score] || 'Weak';

            calendar.event = ''; calendar.date = '';
          }
        }

        return {

      `,
      setup() { return { text: TERMS_TEXT }; }
    };

    const TeamPage = {
      template: `
        <div class="page page--no-tab">
          <div style="display:flex;align-items:center;margin-bottom:16px;">
            <button class="btn" style="padding:8px 16px;min-height:40px;font-size:14px;" @click="$router.back()">Back</button>
          </div>
          <div class="card">
            <div style="white-space:pre-line;line-height:1.8;">{{ text }}</div>
          </div>
        </div>
      `,
      setup() { return { text: TEAM_TEXT }; }
    };

    // 签到页
    const CheckinPage = {
      template: `
        <div class="page page--no-tab">
          <div style="display:flex;align-items:center;margin-bottom:16px;">
            <button class="btn" style="padding:8px 16px;min-height:40px;font-size:14px;" @click="$router.back()">Back</button>
          </div>
          <div class="card">
            <div class="card-title">{{ monthName }}</div>
            <div class="checkin-grid">
              <div v-for="d in 7" :key="'h'+d" class="text-xs text-muted" style="font-weight:700;">{{ ['S','M','T','W','T','F','S'][d-1] }}</div>
              <div v-for="d in daysInMonth" :key="d" class="checkin-day" :class="{ checked: isChecked(d), today: isToday(d) }">
                {{ d }}
              </div>
            </div>
            <button class="btn btn--primary mt-3" style="width:100%;" @click="checkIn">Check In Today</button>
            <p class="text-xs text-muted mt-2">Checked days are highlighted. Data stored locally.</p>
          </div>
        </div>
      `,
      setup() {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const monthName = now.toLocaleString('en', { month: 'long', year: 'numeric' });
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const checkedDays = ref(JSON.parse(localStorage.getItem('checkins') || '[]'));

        function isChecked(d) {
          return checkedDays.value.includes(d);
        }
        function isToday(d) {
          return d === now.getDate();
        }
        function checkIn() {
          const today = now.getDate();
          if (!checkedDays.value.includes(today)) {
            checkedDays.value.push(today);
            localStorage.setItem('checkins', JSON.stringify(checkedDays.value));
          }
          window.dispatchEvent(new CustomEvent('toast', { detail: 'Check-in successful!' }));
        }

        return { monthName, daysInMonth, isChecked, isToday, checkIn };
      }
    };

    // 反馈页
    const FeedbackPage = {
      template: `
        <div class="page page--no-tab">
          <div style="display:flex;align-items:center;margin-bottom:16px;">
            <button class="btn" style="padding:8px 16px;min-height:40px;font-size:14px;" @click="$router.back()">Back</button>
          </div>
          <div class="card">
            <div class="card-title">Feedback</div>
            <label>Title</label>
            <input class="input" v-model="title" placeholder="Summary">
            <label class="mt-2">Message</label>
            <textarea v-model="content" placeholder="Describe your feedback..."></textarea>
            <button class="btn btn--primary mt-3" style="width:100%;" :disabled="!canSend" @click="send">Send</button>
          </div>
        </div>
      `,
      setup() {
        const title = ref('');
        const content = ref('');
        const router = useRouter();
        const canSend = computed(() => title.value.trim() && content.value.trim());

        function send() {
          window.dispatchEvent(new CustomEvent('toast', { detail: 'Feedback sent. Thank you!' }));
          title.value = '';
          content.value = '';
          setTimeout(() => router.back(), 600);
        }
        return { title, content, canSend, send };
      }
    };

    // 站内信件
    const InboxPage = {
      template: `
        <div class="page page--no-tab">
          <div style="display:flex;align-items:center;margin-bottom:16px;">
            <button class="btn" style="padding:8px 16px;min-height:40px;font-size:14px;" @click="$router.back()">Back</button>
          </div>
          <div class="card">
            <div class="card-title">Inbox</div>
            <div v-for="(msg, i) in messages" :key="i" class="settings-item" @click="openMsg(msg)">
              <span style="font-weight:600;">{{ msg.title }}</span>
              <span class="chevron">›</span>
            </div>
          </div>
          <!-- 弹窗 -->
          <div v-if="selected" class="modal-overlay" @click.self="selected = null">
            <div class="modal-box">
              <h3 style="font-weight:700;margin-bottom:12px;color:var(--accent);">{{ selected.title }}</h3>
              <p style="white-space:pre-line;line-height:1.7;">{{ selected.content }}</p>
              <button class="btn btn--primary mt-3" style="width:100%;" @click="selected = null">Close</button>
            </div>
          </div>
        </div>
      `,
      setup() {
        const messages = ref([
          { title: 'Welcome', content: 'Welcome to JFES MAX! Your journey to smarter investing starts here.\n\nExplore our tools, track markets, and stay ahead with real-time insights.' }
        ]);
        const selected = ref(null);
        function openMsg(msg) { selected.value = msg; }
        return { messages, selected, openMsg };
      }
    };

    // -------- 路由配置 --------
    const routes = [
      { path: '/', component: LoadingPage },
      { path: '/home', component: HomePage },
      { path: '/stock/:symbol', component: StockDetailPage },
      { path: '/toolbox', component: ToolboxPage },
      { path: '/settings', component: SettingsPage },
      { path: '/gainers', component: RankingPage, props: { count: 10, title: 'Top Gainers', sortBy: 'changeDesc' } },
      { path: '/losers', component: RankingPage, props: { count: 5, title: 'Top Losers', sortBy: 'changeAsc' } },
      { path: '/active', component: RankingPage, props: { count: 8, title: 'Most Active', sortBy: 'random' } },
      { path: '/potential', component: RankingPage, props: { count: 6, title: 'Potential', sortBy: 'random' } },
      { path: '/picks', component: RankingPage, props: { count: 10, title: "Today's Picks", sortBy: 'random' } },
      { path: '/guide', component: ArticlePage },
      { path: '/notrec', component: RankingPage, props: { count: 10, title: 'Not Recommended', sortBy: 'random' } },
      { path: '/watchlist', component: RankingPage, props: { count: 10, title: 'Watchlist', sortBy: 'random' } },
      { path: '/version', component: VersionPage },
      { path: '/privacy', component: PrivacyPage },
      { path: '/terms', component: TermsPage },
      { path: '/team', component: TeamPage },
      { path: '/checkin', component: CheckinPage },
      { path: '/feedback', component: FeedbackPage },
      { path: '/inbox', component: InboxPage }
    ];

    const router = createRouter({
      history: createWebHashHistory(),
      routes
    });

    // -------- 根组件 (含 TabBar 控制) --------
    const App = {
      template: `
        <div>
          <router-view v-slot="{ Component }">
            <transition name="fade" mode="out-in">
              <component :is="Component" />
            </transition>
          </router-view>
          
          <!-- 底部 Tab 栏 (仅在主页面显示) -->
          <nav class="tab-bar" v-if="showTab">
            <router-link to="/home" class="tab-item">
              <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9z"/></svg>
              <span>Home</span>
            </router-link>
            <router-link to="/toolbox" class="tab-item">
              <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
              <span>Toolbox</span>
            </router-link>
            <router-link to="/settings" class="tab-item">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span>Settings</span>
            </router-link>
          </nav>
        </div>
      `,
      setup() {
        const route = useRoute();
        const showTab = computed(() => {
          const path = route.path;
          return path === '/home' || path === '/toolbox' || path === '/settings';
        });
        return { showTab };
      }
    };

    // Toast 全局监听
    window.addEventListener('toast', (e) => {
      const el = document.createElement('div');
      el.className = 'toast-message';
      el.textContent = e.detail;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    });

    const app = createApp(App);
    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
